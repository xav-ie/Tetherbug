  <rect x="404" y="106" width="140" height="40" rx="10" fill="#281336" stroke="#fff17b" stroke-width="1.5"/>
  <text x="474.0" y="130.5" text-anchor="middle" fill="#fff17b" font-size="13" font-weight="400" opacity="1">Background agent</text>
