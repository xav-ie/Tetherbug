name: Lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # actionlint and shellcheck come from the flake's pinned nixpkgs, so flake.lock versions them.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: nix run --inputs-from . nixpkgs#actionlint

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: git ls-files '*.sh' | xargs nix run --inputs-from . nixpkgs#shellcheck --

  # The SVGs under assets/ are build output; fail if they don't match their generators.
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate the images and compare
        run: |
          python3 assets/build.py
          git diff --exit-code -- assets || { echo "::error::assets/ is out of date: run python3 assets/build.py and commit the result"; exit 1; }

  commit-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the base of the range resolves.
          fetch-depth: 0
      - name: Check the new commits' messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no "before" commit, and a force-push's is gone; check just the pushed one.
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then RANGE="$BASE..$HEAD"; else RANGE="$HEAD^!"; fi
          python3 .github/scripts/check-commit-messages.py "$RANGE"
