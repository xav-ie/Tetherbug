<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Step 3: the phone turns its hotspot on through Shizuku with Apple's marker, and the Mac joins it as a Personal Hotspot</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fff17b"/></marker></defs>
  <rect width="600" height="220" rx="24" fill="#12081a"/>
  <rect x="56" y="54" width="64" height="112" rx="12" fill="#281336" stroke="#fff17b" stroke-width="2.5"/>
  <circle cx="88" cy="66" r="4" fill="#fff17b"/>
  <text x="88" y="196" text-anchor="middle" fill="#fff17b" font-size="13" font-weight="400" opacity="0.8">Phone</text>
  <rect x="40" y="18" width="96" height="26" rx="13" fill="#281336" stroke="#51d136" stroke-width="1.5"/>
  <text x="88" y="36" text-anchor="middle" fill="#51d136" font-size="12" font-weight="400" opacity="1">via Shizuku</text>
  <path d="M130 96 A14 14 0 0 1 130 124" fill="none" stroke="#fff17b" stroke-width="2.5" stroke-linecap="round" opacity="1.0" transform="translate(0 0)"/>
  <path d="M130 84 A26 26 0 0 1 130 136" fill="none" stroke="#fff17b" stroke-width="2.5" stroke-linecap="round" opacity="0.75" transform="translate(0 0)"/>
  <path d="M130 72 A38 38 0 0 1 130 148" fill="none" stroke="#fff17b" stroke-width="2.5" stroke-linecap="round" opacity="0.5" transform="translate(0 0)"/>
  <rect x="196" y="94" width="148" height="32" rx="16" fill="#fff17b"/>
  <text x="270" y="115" text-anchor="middle" fill="#281336" font-size="13" font-weight="600" opacity="1">Apple marker</text>
  <text x="270" y="150" text-anchor="middle" fill="#fff17b" font-size="13" font-weight="400" opacity="0.8">Wi-Fi hotspot on</text>
  <path d="M350 110 H404" stroke="#fff17b" stroke-width="2" marker-end="url(#arrow)"/>
  <g opacity="1"><rect x="424" y="54" width="120" height="76" rx="8" fill="#281336" stroke="#fff17b" stroke-width="2.5"/><path d="M474 54 h20 v4 a3 3 0 0 1 -3 3 h-14 a3 3 0 0 1 -3 -3 z" fill="#fff17b"/>
