name: Release

on:
  push:
    tags: ["v*"]

# One release at a time; never cancel one half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.TETHER_KEYSTORE_BASE64 }}
          TETHER_KEYSTORE_PASSWORD: ${{ secrets.TETHER_KEYSTORE_PASSWORD }}
          TETHER_KEY_ALIAS: ${{ secrets.TETHER_KEY_ALIAS }}
          TETHER_KEY_PASSWORD: ${{ secrets.TETHER_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "TETHER_KEYSTORE_BASE64 secret is missing"; exit 1; }
          export TETHER_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$TETHER_KEYSTORE"
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "${version%%-*}"
          code=$((major * 10000 + minor * 100 + patch))
          nix develop .. --command ./gradlew assembleRelease --no-daemon -PversionName="$version" -PversionCode="$code"
          mv build/outputs/apk/release/tether-link-release.apk "$RUNNER_TEMP/tether-link-$GITHUB_REF_NAME.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: ${{ runner.temp }}/tether-link-*.apk

  release:
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
