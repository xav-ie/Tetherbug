name: Release

# Runs when the release PR from prepare-release.yml merges, publishing the version in
# android/gradle.properties.
# To retry one that failed part-way, re-run its failed jobs from the run's page.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# One release at a time; never cancel one half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && github.head_ref == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - id: version
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^versionName=//p' android/gradle.properties)" >> "$GITHUB_OUTPUT"

  android:
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.TETHER_KEYSTORE_BASE64 }}
          TETHER_KEYSTORE_PASSWORD: ${{ secrets.TETHER_KEYSTORE_PASSWORD }}
          TETHER_KEY_ALIAS: ${{ secrets.TETHER_KEY_ALIAS }}
          TETHER_KEY_PASSWORD: ${{ secrets.TETHER_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "TETHER_KEYSTORE_BASE64 secret is missing"; exit 1; }
          export TETHER_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$TETHER_KEYSTORE"
          nix develop .. --command ./gradlew assembleRelease bundleRelease --no-daemon
          mv build/outputs/apk/release/tetherbug-release.apk "$RUNNER_TEMP/tetherbug-v$VERSION.apk"
          mkdir -p "$RUNNER_TEMP/play"
          mv build/outputs/bundle/release/tetherbug-release.aab "$RUNNER_TEMP/play/tetherbug.aab"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: ${{ runner.temp }}/tetherbug-*.apk
      # Play takes the app bundle, not the APK; kept out of the GitHub release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play
          path: ${{ runner.temp }}/play/tetherbug.aab

  macos:
    needs: [version]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Build universal Tetherbug.app
        run: macos/build.sh "$RUNNER_TEMP/out" "$VERSION" arm64 x86_64
      # Developer ID signing and notarization run when their secrets are set; otherwise the app
      # stays ad-hoc signed (fine for Nix installs, but Gatekeeper warns on downloads).
      - name: Sign and notarize
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          [ -n "$CERT_P12_BASE64" ] || { echo "No Developer ID secrets; leaving the app ad-hoc signed"; exit 0; }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          app="$RUNNER_TEMP/out/Tetherbug.app"
          codesign --force --options runtime --timestamp --identifier ie.xav.tetherbug --sign "Developer ID Application" "$app"
          echo "$NOTARY_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$app"
      - name: Zip the app
        run: ditto -c -k --keepParent "$RUNNER_TEMP/out/Tetherbug.app" "$RUNNER_TEMP/Tetherbug-v$VERSION.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: ${{ runner.temp }}/Tetherbug-*.zip

  # Tags v<version> and creates the GitHub release with CHANGELOG.md's notes and knope.toml's assets.
  release:
    needs: [version, android, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # tag and create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{android,macos}"
          path: artifacts
          merge-multiple: true
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: knope release --verbose

  tap:
    needs: [version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: dist
      - name: Update the Homebrew cask
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          version: ${{ needs.version.outputs.version }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "HOMEBREW_TAP_DEPLOY_KEY is missing; skipping the cask"; exit 0; }
          sha=$(sha256sum dist/Tetherbug-*.zip | cut -d' ' -f1)
          key="$RUNNER_TEMP/tap-key"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:xav-ie/homebrew-tap.git tap
          mkdir -p tap/Casks
          cat > tap/Casks/tetherbug.rb <<EOF
          cask "tetherbug" do
            version "$version"
            sha256 "$sha"

            url "https://github.com/xav-ie/Tetherbug/releases/download/v#{version}/Tetherbug-v#{version}.zip"
            name "Tetherbug"
            desc "Turns your Android phone's hotspot on when your Mac loses Wi-Fi"
            homepage "https://github.com/xav-ie/Tetherbug"

            depends_on macos: ">= :sonoma"

            app "Tetherbug.app"
            binary "#{appdir}/Tetherbug.app/Contents/MacOS/Tetherbug", target: "tetherbug"

            zap trash: [
              "~/Library/Application Support/Tetherbug",
              "~/Library/Preferences/ie.xav.tetherbug.settings.plist",
            ]

            caveats <<~TEXT
              Tetherbug isn't notarized, so macOS blocks it the first time you open it. Allow it under
              System Settings → Privacy & Security → Open Anyway.
            TEXT
          end
          EOF
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tetherbug.rb
          git commit -m "chore(tetherbug): update to $version"
          git push

  # Play's internal testing track gets the bundle and its release notes (changelogs/<versionCode>.txt,
  # which prepare-release.py writes), plus the listing text and images from fastlane/metadata once
  # PLAY_UPLOAD_LISTING is set. Promote to production in Play Console. Skipped without the key.
  play:
    needs: [version, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: play
          path: dist
      - name: Upload to Play's internal testing track
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Play refuses API edits to the listing until the app has passed its first review; set
          # this repo variable to true after that so the listing text and images upload too.
          UPLOAD_LISTING: ${{ vars.PLAY_UPLOAD_LISTING }}
        run: |
          [ -n "$PLAY_JSON" ] || { echo "PLAY_SERVICE_ACCOUNT_JSON is missing; skipping Play"; exit 0; }
          listing=(--skip_upload_metadata --skip_upload_images --skip_upload_screenshots)
          [ "$UPLOAD_LISTING" = true ] && listing=()
          nix run --inputs-from . nixpkgs#fastlane -- supply \
            --package_name ie.xav.tetherbug --aab dist/tetherbug.aab --track internal \
            --json_key_data "$PLAY_JSON" --metadata_path fastlane/metadata/android "${listing[@]}"
